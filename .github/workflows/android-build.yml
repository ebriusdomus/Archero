name: Mythbreaker Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/android-build.yml'

jobs:
  build-android:
    name: Build APK 0.1
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Mythbreaker-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Mythbreaker-Android-

      - name: Build Mythbreaker APK
        uses: game-ci/unity-builder@v5
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildMethod: MythbreakerBuild.BuildAndroid
          versioning: Custom
          version: 0.1.0

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mythbreaker-Android-0.1
          path: Builds/Android/*.apk
          if-no-files-found: warn
